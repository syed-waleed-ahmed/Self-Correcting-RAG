[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-correcting-rag"
version = "0.3.0"
description = "A production-grade, self-correcting multi-agent Retrieval-Augmented Generation pipeline with a REST API and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed Waleed Ahmed" }]
keywords = ["rag", "llm", "retrieval", "agents", "self-correction", "hybrid-search", "pgvector", "fastapi", "groq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

# Core runtime stays lightweight so the package imports (and its test suite runs)
# without the heavy embedding stack. Install the `local` extra for real embeddings.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "openai>=1.30",
    "numpy>=1.23",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # file uploads (POST /api/v1/documents)
    "prometheus-client>=0.20",  # GET /metrics
]

[project.optional-dependencies]
# Lightweight local embedder: ONNX Runtime, no torch (~half the memory). Same
# vectors as sentence-transformers for the same model. Used by the Docker image.
onnx = ["fastembed>=0.4"]
# PyTorch-based local embedder (sentence-transformers pulls torch: heavy).
local = ["sentence-transformers>=2.7", "torch>=2.0"]
# PDF and DOCX ingestion (HTML, CSV, JSON, TXT and Markdown need no extras).
docs = ["pypdf>=4", "python-docx>=1.1"]
# Optional approximate/scalable vector backend.
faiss = ["faiss-cpu>=1.7"]
# Sessions, uploads, history and the job queue (any Postgres with pgvector).
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
# Bearer-JWT admin authentication (e.g. Supabase Auth).
auth = ["pyjwt[crypto]>=2.8"]
# OpenTelemetry tracing (off unless SCRAG_OTEL_EXPORTER is set).
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
# Load testing (loadtests/, docs/load-testing.md). A dev tool: not in "all".
load = ["locust>=2.37"]
# Everything.
all = [
    "fastembed>=0.4",
    "sentence-transformers>=2.7",
    "torch>=2.0",
    "faiss-cpu>=1.7",
    "pypdf>=4",
    "python-docx>=1.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.8",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
# Development / CI.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.8",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "opentelemetry-sdk>=1.25",
]

[project.urls]
Homepage = "https://github.com/syed-waleed-ahmed/Self-Correcting-RAG"
Repository = "https://github.com/syed-waleed-ahmed/Self-Correcting-RAG"
Documentation = "https://github.com/syed-waleed-ahmed/Self-Correcting-RAG#readme"
Issues = "https://github.com/syed-waleed-ahmed/Self-Correcting-RAG/issues"
Changelog = "https://github.com/syed-waleed-ahmed/Self-Correcting-RAG/blob/main/CHANGELOG.md"
Demo = "https://scrag-web.onrender.com"

[project.scripts]
scrag = "scrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrag = ["py.typed", "persistence/sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # Typer/FastAPI use function calls in argument defaults by design.

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgres: needs a Postgres+pgvector database in TEST_DATABASE_URL (skipped otherwise)",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["scrag"]
branch = true
