# Local run of the deployment image.
#
#   docker compose up --build
#
# With a local Postgres (pgvector) for sessions, uploads and history:
#
#   SCRAG_DATABASE_URL=postgresql://postgres:scrag@db:5432/scrag \
#     docker compose --profile db up --build
#
# With a local Prometheus scraping /metrics (http://localhost:9090):
#
#   docker compose --profile observability up --build
services:
  api:
    build: .
    image: self-correcting-rag:latest
    ports:
      - "8000:8000"
    environment:
      # Provide your key via a local .env file (see .env.example).
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your environment or .env}
      SCRAG_LOG_JSON: "true"
      # Empty (the default) runs without a database.
      SCRAG_DATABASE_URL: ${SCRAG_DATABASE_URL:-}
    volumes:
      # Mount your document corpus; the index persists in a named volume.
      - ./data/docs:/app/data/docs:ro
      - scrag_index:/app/data/index
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    profiles: ["db"]
    environment:
      POSTGRES_PASSWORD: scrag  # local development only
      POSTGRES_DB: scrag
    volumes:
      - scrag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  scrag_index:
  scrag_pg:
