name: Deploy web UI (GitHub Pages)

# Publishes web/ as a static site at
# https://<owner>.github.io/<repo>/ - free for public repositories, no extra
# account. The API URL comes from the repository variable SCRAG_API_BASE_URL
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.SCRAG_API_BASE_URL || 'https://scrag-api.onrender.com' }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Serve folders such as _next/ verbatim.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
