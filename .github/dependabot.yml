# Monthly dependency updates, so an unattended repository gets a few PRs a month.
# Minor and patch bumps are grouped into one PR per ecosystem; CI must pass
# before anything is merged. Security updates don't wait for this schedule:
# Dependabot opens them as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Node type definitions must match the Node major the site builds and
      # deploys on (22: NODE_VERSION in render.yaml, node-version in CI).
      # Bump all three together when moving to a new Node LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The deployment image's base (python:3.12-slim). The floating tag already
  # picks up security rebuilds whenever the image is built. A new Python minor
  # is a deliberate upgrade: 3.15 was first proposed before the image's
  # dependencies had wheels for it (pip: ResolutionImpossible, PR #17).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
