# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem to keep the noise down; CI must pass before anything is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Node type definitions must match the Node major the site builds and
      # deploys on (22: NODE_VERSION in render.yaml, node-version in CI).
      # Bump all three together when moving to a new Node LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The deployment image's base (python:3.12-slim): picks up security rebuilds.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
