# Render Blueprint for the SCRAG API on Render's free plan.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# Render asks for the values marked `sync: false`. See docs/deployment.md.
services:
  - type: web
    name: scrag-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Server-side only; never exposed to the browser.
      - key: GROQ_API_KEY
        sync: false
      # Exact origin of the Vercel frontend, as a JSON list, e.g.
      # ["https://scrag-demo.vercel.app"]
      - key: SCRAG_CORS_ALLOW_ORIGINS
        sync: false
      # Operator token for /ingest on the public demo (generated by Render).
      - key: SCRAG_API_AUTH_TOKEN
        generateValue: true
      - key: SCRAG_DEMO_MODE
        value: "true"
      - key: SCRAG_LOG_JSON
        value: "true"
      # Render's proxy appends the client address to X-Forwarded-For.
      - key: SCRAG_FORWARDED_IP_HEADER
        value: x-forwarded-for
      - key: SCRAG_FORWARDED_IP_HOPS
        value: "1"
