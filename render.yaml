# Render Blueprint for the SCRAG API on Render's free plan.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# Render asks for the values marked `sync: false`. See docs/deployment.md.
#
# Forking? Change SCRAG_CORS_ALLOW_ORIGINS, NEXT_PUBLIC_API_BASE_URL and the
# API origin in the static site's Content-Security-Policy (connect-src) below to
# your own URLs (docs/deployment.md, "Deploy your own copy").
services:
  - type: web
    name: scrag-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Server-side only; never exposed to the browser.
      - key: GROQ_API_KEY
        sync: false
      # Origins of the web UI: GitHub Pages and the Render static site below.
      - key: SCRAG_CORS_ALLOW_ORIGINS
        value: '["https://syed-waleed-ahmed.github.io", "https://scrag-web.onrender.com"]'
      # Operator token for /ingest on the public demo (generated by Render).
      - key: SCRAG_API_AUTH_TOKEN
        generateValue: true
      - key: SCRAG_DEMO_MODE
        value: "true"
      - key: SCRAG_LOG_JSON
        value: "true"
      # The visitor's address, for rate limits and quotas. Render sits behind
      # Cloudflare, so X-Forwarded-For arrives as "client, cloudflare, render
      # internal proxy": its last hop is one of a few internal proxies that
      # every visitor shares. Cloudflare sets CF-Connecting-IP to the connecting
      # client and overwrites any value a client sends.
      - key: SCRAG_FORWARDED_IP_HEADER
        value: cf-connecting-ip
      - key: SCRAG_FORWARDED_IP_HOPS
        value: "1"
      # Optional Postgres+pgvector URL (free tier, see docs/deployment.md) for
      # sessions, uploads and history. Unset: the API runs without a database.
      - key: SCRAG_DATABASE_URL
        sync: false

  # The web UI as a free Render static site (served from a CDN, never sleeps).
  # GitHub Pages (.github/workflows/pages.yml) publishes the same UI from main.
  - type: web
    name: scrag-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://scrag-api.onrender.com
    headers:
      # Next.js puts a content hash in every file under _next/static, so a
      # browser can cache them forever. HTML stays revalidated (Render default).
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The static export uses inline bootstrap scripts, hence 'unsafe-inline'.
      # connect-src must list the API origin (change it in a fork).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://scrag-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
